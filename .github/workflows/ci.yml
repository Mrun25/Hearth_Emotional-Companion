name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scorer-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run scorer rubric cases (gated expectations)
        run: python tests/test_scorer_cases.py
